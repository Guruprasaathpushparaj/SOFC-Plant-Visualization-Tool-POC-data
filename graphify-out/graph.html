<style>

:root {
  --bg: #f3f5f8; --bg2: #ffffff; --dot: #d3dbe4;
  --ink: #14202c; --muted: #566676; --line: #c9d3dd; --edge: #8d9cab;
  --panel: rgba(255,255,255,.86); --panel-solid: #ffffff; --hover: #e8edf2;
  --glow: 0;
  /* project-part colour slots (dataviz reference categorical order, CVD-validated adjacent pairs); s6 = "Other" */
  --s0: #2a78d6; --s1: #eb6834; --s2: #1baf7a; --s3: #eda100; --s4: #e87ba4; --s5: #008300; --s6: #8d9cab;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b131c; --bg2: #13202e; --dot: #1c2a39;
  --ink: #e6edf3; --muted: #8b9bab; --line: #263646; --edge: #50647a;
  --panel: rgba(13,22,32,.80); --panel-solid: #101b27; --hover: #1a2836;
  --glow: 1;
  --s0: #3987e5; --s1: #d95926; --s2: #199e70; --s3: #c98500; --s4: #d55181; --s5: #2e9a2e; --s6: #6b7f93;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b131c; --bg2: #13202e; --dot: #1c2a39;
  --ink: #e6edf3; --muted: #8b9bab; --line: #263646; --edge: #50647a;
  --panel: rgba(13,22,32,.80); --panel-solid: #101b27; --hover: #1a2836;
  --glow: 1;
  --s0: #3987e5; --s1: #d95926; --s2: #199e70; --s3: #c98500; --s4: #d55181; --s5: #2e9a2e; --s6: #6b7f93;
  color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14.5px; overflow: hidden; }
#board { position: fixed; inset: 0; display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
#board:active { cursor: grabbing; }

.box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; backdrop-filter: blur(10px) saturate(1.2); -webkit-backdrop-filter: blur(10px) saturate(1.2); box-shadow: 0 8px 30px rgba(0,0,0,.18); }
.strip { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px; pointer-events: none; z-index: 5; }
.strip > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 7px 12px 7px 10px; }
.brand .mark { display: grid; grid-template-columns: repeat(2, 7px); gap: 2px; }
.brand .mark i { width: 7px; height: 7px; border-radius: 2px; }
.brand h1 { font-family: var(--f-display); font-weight: 600; font-size: 20px; letter-spacing: .01em; margin: 0; line-height: 1; }
.brand small { display: block; font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); margin-top: 3px; letter-spacing: .02em; }
.search { position: relative; flex: 1 1 220px; max-width: 360px; }
.search input { width: 100%; box-sizing: border-box; font: inherit; padding: 9px 34px 9px 32px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; backdrop-filter: blur(10px); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: var(--muted); fill: none; stroke-width: 2; }
.search kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font: 500 11px var(--f-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.sugg { position: absolute; top: calc(100% + 4px); left: 0; right: 0; max-height: 320px; overflow: auto; list-style: none; margin: 0; padding: 4px; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 8px; z-index: 20; box-shadow: 0 12px 30px rgba(0,0,0,.25); }
.sugg li { padding: 7px 8px; border-radius: 5px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
.sugg li[aria-selected="true"], .sugg li:hover { background: var(--hover); }
.sugg .t { font-size: 12px; color: var(--muted); margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; transition: border-color .15s, background .15s; }
button:hover { border-color: var(--edge); background: var(--hover); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--s0); outline-offset: 2px; }
button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
button.primary:hover { background: var(--ink); opacity: .88; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.tools button { backdrop-filter: blur(10px); }
.filters { display: flex; gap: 2px; flex-wrap: wrap; align-items: center; padding: 4px 6px; font-size: 13px; }
.filters label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; padding: 4px 7px; border-radius: 5px; }
.filters label:hover { background: var(--hover); }
.filters input { accent-color: var(--ink); margin: 0; }
.filters .k { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .1em; font-size: 11.5px; color: var(--muted); padding: 0 4px; }
.shape { width: 9px; height: 9px; display: inline-block; flex: none; background: var(--muted); }
.shape.code { border-radius: 50%; } .shape.doc { transform: rotate(45deg) scale(.85); } .shape.image { clip-path: polygon(50% 0, 100% 100%, 0 100%); } .shape.note { width: 7px; height: 7px; border-radius: 1px; opacity: .7; } .shape.ext { border-radius: 50%; background: transparent; border: 2px solid var(--muted); width: 5px; height: 5px; }

h2.lbl { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .1em; font-size: 11.5px; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.key { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); width: 268px; max-height: calc(100% - 150px); overflow: auto; padding: 12px; z-index: 4; scrollbar-width: thin; }
.area + .area { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.area-h { width: 100%; border: 0; background: transparent; padding: 3px 4px; display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: center; text-align: left; }
.area-h b { font-family: var(--f-display); font-weight: 600; font-size: 15px; letter-spacing: .02em; }
.area-h .sw { width: 12px; height: 12px; border-radius: 3px; }
.area-h[aria-pressed="true"], .key li button[aria-pressed="true"] { background: var(--hover); }
.key ul { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 1px; }
.key li button { width: 100%; text-align: left; border: 0; background: transparent; padding: 4px 4px 6px 24px; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 13px; position: relative; border-radius: 5px; }
.key li button:hover { background: var(--hover); }
.key .bar { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.key .bar i { display: block; height: 100%; border-radius: 2px; }
.n { font-family: var(--f-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.key-toggle { display: none; }

.panel { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 72px); right: max(16px, env(safe-area-inset-right, 0px)); max-height: calc(100% - 72px - 14px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); width: 340px; box-sizing: border-box; overflow: auto; padding: 16px 18px; z-index: 4; scrollbar-width: thin; }
.panel .eyebrow { font-family: var(--f-mono); font-size: 11px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; text-transform: uppercase; letter-spacing: .04em; }
.panel h3 { font-family: var(--f-display); font-weight: 600; font-size: 26px; line-height: 1.08; margin: 8px 0 8px; text-wrap: balance; word-break: break-word; }
.panel p { margin: 0 0 10px; line-height: 1.5; }
.panel .where { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); word-break: break-all; margin-bottom: 12px; line-height: 1.5; }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-family: var(--f-body); font-size: 11.5px; border: 1px solid var(--line); text-transform: none; letter-spacing: 0; color: var(--ink); }
.tag i { width: 7px; height: 7px; border-radius: 2px; display: inline-block; }
.rel { margin: 14px 0 0; }
.rel h4 { margin: 0 0 4px; font-size: 12px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; text-transform: uppercase; letter-spacing: .06em; font-family: var(--f-display); }
.rel ul, .hub-list { list-style: none; margin: 0; padding: 0; }
.rel li button, .hub-list button { width: 100%; text-align: left; background: transparent; border: 0; border-radius: 5px; padding: 6px 4px; display: flex; gap: 8px; align-items: center; font-size: 13.5px; }
.rel li + li button { border-top: 1px solid var(--line); border-radius: 0; }
.rel li button:hover, .hub-list button:hover { background: var(--hover); }
.rel li .guess { font-size: 10.5px; color: var(--muted); margin-left: auto; font-family: var(--f-mono); }
.hub-list .n { margin-left: auto; }
.steps { list-style: none; margin: 10px 0 12px; padding: 0; }
.steps li { position: relative; padding: 2px 0 14px 28px; }
.steps li::before { content: ""; position: absolute; left: 4px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--ink)); box-shadow: 0 0 0 3px var(--panel-solid), 0 0 0 4px var(--c, var(--ink)); }
.steps li:not(:last-child)::after { content: ""; position: absolute; left: 8.5px; top: 20px; bottom: 0; border-left: 1px dashed var(--edge); }
.steps .via { font-family: var(--f-mono); font-size: 11px; color: var(--muted); display: block; margin-top: 2px; }
.steps button { background: none; border: 0; padding: 0; text-align: left; font-weight: 600; }
.steps button:hover { text-decoration: underline; background: none; }
.picker { display: grid; gap: 8px; margin: 10px 0; }
.picker .slot { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 1px dashed var(--edge); border-radius: 8px; font-size: 14px; }
.picker .slot b { font-family: var(--f-display); letter-spacing: .08em; text-transform: uppercase; font-size: 11.5px; color: var(--muted); width: 36px; }
.picker .slot.on { border-style: solid; border-color: var(--ink); }
.muted { color: var(--muted); font-size: 13px; }
.stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0 14px; }
.stat b { font-family: var(--f-display); font-size: 28px; font-weight: 600; display: block; font-variant-numeric: tabular-nums; line-height: 1; }
.stat span { font-size: 11.5px; color: var(--muted); }
.split { display: flex; gap: 2px; height: 10px; margin: 6px 0 8px; }
.split i { border-radius: 3px; }
.split-key { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 1px; }
.split-key button { width: 100%; border: 0; background: transparent; display: grid; grid-template-columns: 12px 1fr auto auto; gap: 8px; align-items: center; padding: 5px 4px; text-align: left; font-size: 13.5px; border-radius: 5px; }
.split-key button:hover { background: var(--hover); }
.split-key .sw { width: 10px; height: 10px; border-radius: 3px; }

.tip { position: fixed; pointer-events: none; z-index: 30; padding: 7px 10px; font-size: 13px; max-width: 280px; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.tip small { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 11.5px; margin-top: 2px; }
.tip small i { width: 7px; height: 7px; border-radius: 2px; }

.tour { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); width: min(540px, calc(100% - 32px)); box-sizing: border-box; padding: 16px 18px; z-index: 10; }
.tour .prog { display: flex; gap: 4px; margin-bottom: 10px; }
.tour .prog i { flex: 1; height: 3px; border-radius: 2px; background: var(--line); }
.tour .prog i.on { background: var(--ink); }
.tour .count { font-family: var(--f-mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.tour h3 { font-family: var(--f-display); font-size: 23px; margin: 3px 0 6px; font-weight: 600; text-wrap: balance; }
.tour p { margin: 0 0 12px; line-height: 1.5; }
.tour .nav { display: flex; gap: 8px; justify-content: flex-end; }

@media (max-width: 760px) {
  .brand h1 { font-size: 17px; }
  .search { max-width: none; flex-basis: 100%; order: 3; }
  .search kbd { display: none; }
  .filters { order: 4; }
  .panel { top: auto; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); width: auto; max-height: 42%; }
  .key { display: none; }
  .key.open { display: block; bottom: auto; top: 50%; transform: translateY(-50%); z-index: 12; width: auto; right: max(16px, env(safe-area-inset-right, 0px)); max-height: 70%; }
  .key-toggle { display: inline-block; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>

s a map","text":"Each dot here is a part of the real plant from the layout drawing: gas lines, heaters, reformer, burner, stack and inverters. The links follow the pipes, so the air path, the fuel path and the flue-gas path show up as chains.","nodes":[],"comm":4},{"title":"A link nobody wrote down","text":"The twin’s chain of linked stages and the synthetic-day generator’s “allowed stage changes” rule were written separately, but they describe the same thing. The extractor guessed this link (dashed line). Worth keeping the two in step.","nodes":[520,484]},{"title":"Every temperature trip ends in one place","text":"Exhaust, stack, afterburner and heater over-temperature limits all lead to the safety PLC’s emergency purge. Six of the nine real trips came from the exhaust limit.","nodes":[647]},{"title":"Which sensors can be rebuilt from the core 50?","text":"This island comes from the heatmap drawing. It links the 106 extra sensors to each stage and says whether they follow the 50 core sensors. Part load is the hard case: most sensors behave on their own there.","nodes":[],"comm":9},{"title":"What the outside world calls our stages","text":"Patents and papers (LG, Hanasaki, Toto, Bloom, IEC 62282) use other names for the same stages. Guessed links tie them to our hot standby, start-up and part load. Trip, hot idle and cold start were not found in the literature.","nodes":[],"comm":25},{"title":"Your turn","text":"Search for any tag or script, click a part or topic on the left, or press “How are two things linked?” to trace a chain between any two dots.","nodes":[]}],"examples":[[611,197],[626,394],[526,334],[619,269]],"stats":{"nodes":780,"links":1571,"date":"2026-11-05"}};

    b.onclick = () => { if (commFocus === i) return clearAll(); focusComm(i); if (innerWidth <= 760) $('key').classList.remove('open'); }; });
  $('keyList').querySelectorAll('button[data-a]').forEach(b => { const i = +b.dataset.a;
    b.onclick = () => { if (areaFocus === i) return clearAll(); focusArea(i); if (innerWidth <= 760) $('key').classList.remove('open'); }; });
}
function markKey() {
  document.querySelectorAll('#keyList button[data-c]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.c === commFocus));
  document.querySelectorAll('#keyList button[data-a]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.a === areaFocus));
}
function crossCounts(inside) { const out = {}; L.forEach(l => { if (!visL(l)) return; const a = inside(l.source), b = inside(l.target); if (a !== b) { const o = a ? l.target : l.source; out[o.c] = (out[o.c] || 0) + 1; } }); return out; }
function focusArea(ai) {
  if (tourAt >= 0) endTour(false);
  sel = null; path = null; commFocus = null; areaFocus = ai; markKey();
  const a = A[ai], mem = N.filter(n => C[n.c].area === ai && visN(n)); setFocus(new Set(mem));
  view(() => {
    const files = new Set(mem.map(n => n.file).filter(Boolean));
    const outA = {}; L.forEach(l => { if (!visL(l)) return; const x = C[l.source.c].area, y = C[l.target.c].area; if (x !== y && (x === ai || y === ai)) { const o = x === ai ? y : x; outA[o] = (outA[o] || 0) + 1; } });
    const P = $('panel'); P.hidden = false;
    P.innerHTML = `<div class="eyebrow"><span class="shape" style="background:${a.col};border-radius:2px"></span>Project part</div><h3>${esc(a.name)}</h3><p>${esc(a.blurb)}</p>
      <div class="stat"><div><b>${mem.length}</b><span>things</span></div><div><b>${a.comms.length}</b><span>topics</span></div><div><b>${files.size}</b><span>files</span></div></div>
      <h2 class="lbl">Topics</h2><ul class="hub-list">${a.comms.map(i => `<li><button data-c="${i}"><span class="shape" style="background:${C[i].col};border-radius:2px"></span>${esc(C[i].name)}<span class="n">${C[i].size}</span></button></li>`).join('')}</ul>
      <h2 class="lbl" style="margin-top:14px">Links to the other parts</h2><ul class="hub-list">${Object.entries(outA).sort((x, y) => y[1] - x[1]).map(([o, k]) => `<li><button data-a="${o}"><span class="shape" style="background:${A[o].col};border-radius:2px"></span>${esc(A[o].name)}<span class="n">${k} links</span></button></li>`).join('') || '<li class="muted">None with the current filters</li>'}</ul>`;
    P.querySelectorAll('button[data-c]').forEach(b => b.onclick = () => focusComm(+b.dataset.c));
    P.querySelectorAll('button[data-a]').forEach(b => b.onclick = () => focusArea(+b.dataset.a));
  });
  fit(mem, 40); draw();
}
function focusComm(i) {
  if (tourAt >= 0) endTour(false);
  sel = null; path = null; commFocus = i; areaFocus = null; markKey();
  const mem = N.filter(n => n.c === i && visN(n)); setFocus(new Set(mem));
  view(() => {
    const inner = L.filter(l => visL(l) && l.source.c === i && l.target.c === i).length;
    const out = crossCounts(n => n.c === i);
    const top = mem.slice().sort((a, b) => b.deg - a.deg).slice(0, 10);
    const files = [...new Set(mem.map(n => n.file).filter(Boolean))];
    const P = $('panel'); P.hidden = false;
    P.innerHTML = `<div class="eyebrow"><span class="shape" style="background:${C[i].col};border-radius:2px"></span>Topic island · ${esc(A[C[i].area].name)}</div><h3>${esc(C[i].name)}</h3>
      <div class="stat"><div><b>${mem.length}</b><span>things</span></div><div><b>${inner}</b><span>inner links</span></div><div><b>${files.length}</b><span>files</span></div></div>
      <h2 class="lbl">Main pieces</h2><ul class="hub-list">${top.map(n => `<li><button data-n="${n.i}">${sh(n)}${esc(n.label)}<span class="n">${n.deg}</span></button></li>`).join('')}</ul>
      <h2 class="lbl" style="margin-top:14px">Talks most to</h2><ul class="hub-list">${Object.entries(out).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([o, k]) => `<li><button data-c="${o}"><span class="shape" style="background:${C[o].col};border-radius:2px"></span>${esc(C[o].name)}<span class="n">${k} links</span></button></li>`).join('') || '<li class="muted">No links to other topics</li>'}</ul>
      <h2 class="lbl" style="margin-top:14px">Files</h2><div class="where">${files.slice(0, 12).map(esc).join('<br>')}${files.length > 12 ? '<br>…' : ''}</div>`;
    P.querySelectorAll('[data-n]').forEach(b => b.onclick = () => select(N[+b.dataset.n]));
    P.querySelectorAll('button[data-c]').forEach(b => b.onclick = () => focusComm(+b.dataset.c));
  });
  fit(mem, 40); draw();
}

// ---- path finder ----
function startPath() {
  if (tourAt >= 0) endTour(false);
  pathPick = []; path = null; sel = null; commFocus = null; areaFocus = null; setFocus(null); markKey(); view(renderPick); draw();
}
function renderPick() {
  const P = $('panel'); P.hidden = false;
  const a = pathPick && pathPick[0], b = pathPick && pathPick[1];
  P.innerHTML = `<div class="eyebrow">Path finder</div><h3>How are two things linked?</h3>
    <p class="muted">Click two dots on the map, or search for them. The map lights up the shortest chain of links between them.</p>
    <div class="picker"><div class="slot ${a ? 'on' : ''}"><b>From</b>${a ? esc(a.label) : '<span class="muted">pick the first dot…</span>'}</div>
    <div class="slot ${b ? 'on' : ''}"><b>To</b>${b ? esc(b.label) : '<span class="muted">…then the second</span>'}</div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap"><button id="pex" class="primary">Try an example</button><button id="pcancel">Cancel</button></div>`;
  $('pcancel').onclick = clearAll;
  $('pex').onclick = () => { const ex = DATA.examples[Math.floor(Math.random() * DATA.examples.length)]; pathPick = []; pickPath(N[ex[0]]); pickPath(N[ex[1]]); };
}
function pickPath(n) {
  if (!pathPick) startPath();
  pathPick.push(n);
  if (pathPick.length < 2) { view(renderPick); draw(); return; }
  const [a, b] = pathPick; pathPick = null;
  const prev = new Map([[a, null]]), q = [a];
  while (q.length) { const u = q.shift(); if (u === b) break; for (const j of adj[u.i]) { const l = L[j]; if (!visL(l)) continue; const v = l.source === u ? l.target : l.source; if (!prev.has(v)) { prev.set(v, [u, l]); q.push(v); } } }
  if (!prev.has(b)) { path = null; setFocus(new Set([a, b]));
    view(() => { const P = $('panel'); P.innerHTML = `<div class="eyebrow">Path finder</div><h3>No link found</h3><p><b>${esc(a.label)}</b> and <b>${esc(b.label)}</b> are not connected with the current filters. Try turning on “Outside tools” or “Guessed links”.</p><button id="pagain">Pick again</button>`; $('pagain').onclick = startPath; });
    draw(); return; }
  const nodes = [b], links = []; let cur = b; while (prev.get(cur)) { const [u, l] = prev.get(cur); links.push(l); nodes.push(u); cur = u; }
  nodes.reverse(); links.reverse();
  path = { nodes, links }; setFocus(new Set(nodes), new Set(links));
  const topics = new Set(nodes.map(n => n.c));
  view(() => {
    const P = $('panel');
    P.innerHTML = `<div class="eyebrow">Path finder · ${links.length} step${links.length === 1 ? '' : 's'} · ${topics.size} topic${topics.size === 1 ? '' : 's'}</div><h3>${esc(a.label)} → ${esc(b.label)}</h3>
      <ol class="steps">${nodes.map((n, k) => `<li style="--c:${C[n.c].col}"><button data-n="${n.i}">${esc(n.label)}</button> ${tagC(n.c)}${k < links.length ? `<span class="via">${links[k].source === n ? '↓ ' : '↑ '}${esc(links[k].rel.replace(/_/g, ' '))}${links[k].conf ? ' (guessed)' : ''}</span>` : ''}</li>`).join('')}</ol>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><button id="pagain" class="primary">Find another</button><button id="pclose">Done</button></div>`;
    P.querySelectorAll('[data-n]').forEach(x => x.onclick = () => select(N[+x.dataset.n]));
    $('pagain').onclick = startPath; $('pclose').onclick = clearAll;
  });
  fit(nodes, 80); draw();
}

// ---- tour ----
function showTour() {
  const s = DATA.tour[tourAt], box = $('tour'); box.hidden = false;
  sel = null; commFocus = null; areaFocus = null; path = null; pathPick = null; markKey();
  const ns = s.nodes.map(i => N[i]);
  ns.forEach(n => { if (!visN(n)) { show[n.k === 'file' ? 'code' : n.k] = true; $('f-' + (n.k === 'file' ? 'code' : n.k)).checked = true; } });
  if (s.comm != null) { commFocus = s.comm; setFocus(new Set(N.filter(n => n.c === s.comm))); }
  else if (s.area != null) { areaFocus = s.area; setFocus(new Set(N.filter(n => C[n.c].area === s.area))); }
  else if (ns.length === 2) { setFocus(new Set(ns), new Set(L.filter(l => ns.includes(l.source) && ns.includes(l.target)))); }
  else if (ns.length === 1) setFocus(neigh(ns[0]), new Set(adj[ns[0].i].map(j => L[j]))); else setFocus(null);
  box.innerHTML = `<div class="prog">${DATA.tour.map((_, k) => `<i class="${k <= tourAt ? 'on' : ''}"></i>`).join('')}</div>
    <div class="count">Stop ${tourAt + 1} of ${DATA.tour.length}</div><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p>
    <div class="nav"><button id="tEnd">End tour</button>${tourAt > 0 ? '<button id="tPrev">Back</button>' : ''}<button id="tNext" class="primary">${tourAt < DATA.tour.length - 1 ? 'Next' : 'Explore on my own'}</button></div>`;
  $('tEnd').onclick = () => endTour(true);
  if ($('tPrev')) $('tPrev').onclick = () => { tourAt--; showTour(); };
  $('tNext').onclick = () => { if (tourAt < DATA.tour.length - 1) { tourAt++; showTour(); } else endTour(true); };
  $('tNext').focus({ preventScroll: true });
  if (s.comm != null) fit(N.filter(n => n.c === s.comm), 40, 1100); else if (s.area != null) fit(N.filter(n => C[n.c].area === s.area), 40, 1100); else if (ns.length) fit(ns.length === 1 ? [...neigh(ns[0])] : ns, ns.length === 1 ? 60 : 160, 1100); else fit(N, 40, 1100);
  draw();
}
function endTour(reset) { tourAt = -1; $('tour').hidden = true; if (reset) { clearAll(); fit(N, 40); } }
$('tourBtn').onclick = () => { tourAt = 0; showTour(); };

// ---- search ----
const idx = N.map(n => (n.label + ' ' + (n.file || '') + ' ' + C[n.c].name).toLowerCase());
let hits = [], hi = 0;
function renderSugg() {
  const u = $('sugg');
  if (!hits.length) { u.hidden = true; return; }
  u.hidden = false;
  u.innerHTML = hits.map((n, k) => `<li role="option" data-n="${n.i}" aria-selected="${k === hi}">${sh(n)}${esc(n.label)}<span class="t">${esc(C[n.c].name)}</span></li>`).join('');
  u.querySelectorAll('li').forEach(li => li.onmousedown = e => { e.preventDefault(); choose(N[+li.dataset.n]); });
}
function choose(n) {
  hits = []; renderSugg(); $('q').value = n.label; $('q').blur();
  if (!visN(n)) { const k = n.k === 'file' ? 'code' : n.k; show[k] = true; $('f-' + k).checked = true; }
  if (pathPick) pickPath(n); else select(n);
}
$('q').addEventListener('input', e => {
  const v = e.target.value.trim().toLowerCase(); hi = 0;
  if (v.length < 2) { hits = []; return renderSugg(); }
  const terms = v.split(/\s+/);
  hits = N.filter((n, i) => terms.every(t => idx[i].includes(t))).sort((a, b) => (b.label.toLowerCase().startsWith(v) - a.label.toLowerCase().startsWith(v)) || b.deg - a.deg).slice(0, 12);
  renderSugg();
});
$('q').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { hi = Math.min(hi + 1, hits.length - 1); renderSugg(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { hi = Math.max(hi - 1, 0); renderSugg(); e.preventDefault(); }
  else if (e.key === 'Enter' && hits[hi]) choose(hits[hi]);
  else if (e.key === 'Escape') { hits = []; renderSugg(); }
});
$('q').addEventListener('blur', () => setTimeout(() => { hits = []; renderSugg(); }, 120));
addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); }
  else if (e.key === 'Escape' && document.activeElement !== $('q')) { if (tourAt >= 0) endTour(true); else clearAll(); }
});

// ---- filters + buttons ----
for (const k of ['code', 'doc', 'image', 'note', 'ext', 'guess']) $('f-' + k).onchange = e => { show[k] = e.target.checked;
  if (sel) select(sel, false); else if (commFocus !== null) focusComm(commFocus); else if (areaFocus !== null) focusArea(areaFocus); else draw(); };
$('pathBtn').onclick = startPath;
$('fitBtn').onclick = () => { clearAll(); fit(N, 40); };
$('keyBtn').onclick = () => $('key').classList.toggle('open');

$('sub').textContent = `${DATA.stats.nodes} things · ${C.length} topics · ${A.length} parts · built ${DATA.stats.date}`;
addEventListener('resize', resize);
readTheme(); view(home); resize();
fit(N, 40, 0);
})();
</script>
